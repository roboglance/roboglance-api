[project]
name = "roboglance"
version = "0.1.0"
description = "The backend API of RoboGlance."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "fastapi-cli>=0.0.32",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "respx>=0.23.1",
    "ruff>=0.16.1",
    "ty>=0.0.65",
]

[tool.uv]
required-version = ">=0.11.8"

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest]
strict = true
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
anyio_mode = "auto"

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
